<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PustakaHadith — WhatsApp Promo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1080px;height:1080px;
    font-family:'Segoe UI',system-ui,sans-serif;
    background:#0A1520;
    color:#EAF6F6;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:60px;
    position:relative;overflow:hidden;
  }
  .bg{
    position:absolute;inset:0;
    background:url('landing-page/img/bg-globe.webp') center/cover no-repeat;
    opacity:.25;z-index:0;
  }
  .overlay{
    position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(10,21,32,.95),rgba(6,37,31,.9));
    z-index:1;
  }
  .glow{
    position:absolute;width:400px;height:400px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(62,201,176,.2),transparent 70%);
    z-index:1;
  }
  .g1{top:-100px;right:-100px}
  .g2{bottom:-100px;left:-100px}
  .content{position:relative;z-index:2;text-align:center;max-width:900px}
  .logo{width:120px;height:120px;border-radius:24px;margin:0 auto 30px;box-shadow:0 20px 60px rgba(62,201,176,.3)}
  h1{font-size:52px;font-weight:800;margin-bottom:8px;letter-spacing:-1px}
  h1 .teal{color:#3EC9B0}
  .tagline{font-size:22px;color:#9FBFCB;margin-bottom:40px;letter-spacing:1px}
  .features{
    display:grid;grid-template-columns:1fr 1fr;
    gap:18px 40px;text-align:left;margin:0 auto 44px;
    max-width:700px;
  }
  .feat{
    display:flex;align-items:center;gap:14px;
    font-size:22px;font-weight:600;
  }
  .feat .icon{
    width:42px;height:42px;border-radius:12px;
    background:rgba(62,201,176,.15);
    border:1px solid rgba(62,201,176,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .feat span{color:#EAF6F6}
  .stats{
    display:flex;gap:40px;justify-content:center;
    margin-bottom:44px;
  }
  .stat{text-align:center}
  .stat .num{font-size:42px;font-weight:800;color:#6FDCC8;line-height:1}
  .stat .lbl{font-size:14px;color:#7FA3B0;margin-top:6px;letter-spacing:1px;text-transform:uppercase}
  .cta{
    display:inline-flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,#3EC9B0,#2DB89A);
    color:#06251F;font-size:24px;font-weight:800;
    padding:18px 44px;border-radius:999px;
    box-shadow:0 8px 40px rgba(62,201,176,.4);
    margin-bottom:24px;
  }
  .url{font-size:18px;color:#6E93A1;letter-spacing:1px}
  .url b{color:#9FBFCB}
</style>
</head>
<body>
<div class="bg"></div>
<div class="overlay"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="content">
  <img class="logo" src="landing-page/img/logo.png" alt="PustakaHadith">
  <h1><span class="teal">Pustaka</span>Hadith</h1>
  <div class="tagline">Perpustakaan Digital Hadis — Percuma &amp; Offline</div>
  <div class="features">
    <div class="feat"><div class="icon">📖</div><span>62,169 Hadis Lengkap</span></div>
    <div class="feat"><div class="icon">📚</div><span>9 Kitab Utama</span></div>
    <div class="feat"><div class="icon">🔍</div><span>Carian Makna AI</span></div>
    <div class="feat"><div class="icon">🌐</div><span>4 Bahasa Selari</span></div>
    <div class="feat"><div class="icon">⭐</div><span>Darjat &amp; Syarah</span></div>
    <div class="feat"><div class="icon">📴</div><span>100% Offline</span></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num">62,169</div><div class="lbl">Hadis</div></div>
    <div class="stat"><div class="num">9</div><div class="lbl">Kitab</div></div>
    <div class="stat"><div class="num">4</div><div class="lbl">Bahasa</div></div>
    <div class="stat"><div class="num">100%</div><div class="lbl">Percuma</div></div>
  </div>
  <div class="cta">📱 Muat Turun Percuma</div>
  <div class="url"><b>pustakahadith.my</b></div>
</div>
</body>
</html>
